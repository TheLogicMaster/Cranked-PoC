plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cranked.poc'
    compileSdk 34

    defaultConfig {
        applicationId 'org.cranked.poc'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        // the native library is built for these ABIs by scripts/build.sh (ANDROID_ABIS)
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key, so the APK installs as is; sign it with your own key to publish it
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        checkReleaseBuilds false // the build does not stop on lint findings
        abortOnError false
    }
}
