# DOSBox-X settings for Cranked. Run DOSBox-X from this folder: dosbox-x -conf DOSBOX-X.CONF
# (the folder it starts in becomes drive C:), then type CRANK GAME.ZIP with your game's file name.
# The lines marked "needed" matter; the others are DOSBox-X's defaults, written out to be sure.

[dosbox]
# needed: never ask for a working folder (a first run asks, and the snap's folder picker can fail)
working directory option=noprompt
# needed: the default 16 MB is too little for Cranked and a game
memsize=64
# the default: an S3 card, with the VESA 800x600 mode for the screen at double size
machine=svga_s3

[cpu]
# needed: as fast as the host allows (Cranked needs all of it)
cycles=max
# a Pentium, which the build needs
cputype=pentium_mmx
core=dynamic

[sblaster]
# the default: a Sound Blaster 16 (DOSBox-X sets BLASTER to match)
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[dos]
# needed: long file names (game save data go in folders named after bundle IDs)
lfn=true

[autoexec]
mount c .
c:
echo Type CRANK and a game's file name, for example CRANK GAME.ZIP
